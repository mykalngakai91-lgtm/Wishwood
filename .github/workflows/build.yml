name: Build PS4 PKG

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies & OpenOrbis Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-pip clang lld wget
          git clone https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git openorbis
          
          # Download or ensure packaging tool is available
          mkdir -p openorbis/bin
          if [ ! -f openorbis/bin/create-pkg ]; then
              wget -q -O openorbis/bin/create-pkg https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/raw/master/bin/linux/create-pkg || touch openorbis/bin/create-pkg
              chmod +x openorbis/bin/create-pkg
          fi

      - name: Build Package
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload PKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WISH30300-pkg
          path: WISH30300.pkg

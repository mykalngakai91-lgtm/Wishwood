name: Build PS4 PKG

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install OpenOrbis Toolchain & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-pip clang lld
          git clone https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git openorbis

      - name: Build Package
        env:
          OO_PS4_TOOLCHAIN: ${{ github.workspace }}/openorbis
          C_INCLUDE_PATH: ${{ github.workspace }}/openorbis/include
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload PKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WISH30300-pkg
          path: WISH30300.pkg
